<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../assets/brand-icon.svg" />
    <title>Playwright lesson demo</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; color: #263a3b; background: #f4f8f7; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; }
      .site-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid #e2ece9; border-radius: 8px; background: #fff; }
      .brand { display: flex; align-items: center; gap: 8px; color: #246f65; font-size: 11px; font-weight: 700; }
      .brand-mark { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; background: #e7f5f0; }
      .site-header small,.eyebrow { color: #79918c; font: 10px/1.5 "Segoe UI",Arial,sans-serif; letter-spacing: .45px; }
      main { max-width: 430px; margin: 19px auto 0; }
      .eyebrow { color: #318a79; font-weight: 700; }
      h1 { margin: 6px 0; font-size: 19px; letter-spacing: -.45px; }
      .intro { margin: 0 0 14px; color: #778885; font-size: 12px; line-height: 1.6; }
      .demo-card { padding: 11px; border: 1px solid #e0ebe8; border-radius: 9px; background: #fff; box-shadow: 0 8px 22px #2758490a; }
      .demo-card h2 { margin: 0 0 5px; font-size: 12px; }
      .demo-card > p { margin: 0 0 12px; color: #71817e; font-size: 11px; line-height: 1.6; }
      .visual-guide { margin-bottom: 10px; padding: 10px; border: 1px solid #dfeae7; border-radius: 8px; background: linear-gradient(135deg,#f8fbfa,#fff); }
      .guide-heading { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 7px; }
      .guide-heading strong { color: #365651; font-size: 11px; }
      .guide-heading span { color: #78918b; font: 9px "Segoe UI",Arial,sans-serif; }
      .compare-panels { display: grid; grid-template-columns: minmax(0,1fr) 18px minmax(0,1fr); gap: 5px; align-items: center; }
      .compare-panel { min-width: 0; padding: 6px; border: 1px solid #e4eae8; border-radius: 6px; background: #fff; }
      .compare-panel.after { border-color: #b8ded0; background: #f5fbf7; }
      .compare-panel > small { display: block; margin-bottom: 4px; color: #84928f; font: 700 9px "Segoe UI",Arial,sans-serif; letter-spacing: .35px; }
      .compare-panel.after > small { color: #25866f; }
      .compare-panel p { min-height: 25px; margin: 4px 0 0; color: #5c6c69; font-size: 9px; line-height: 1.4; overflow-wrap: anywhere; }
      .state-picture { display: block; width: 100%; height: auto; }
      .compare-arrow { color: #268c77; font-size: 14px; font-weight: 700; text-align: center; }
      .difference-note { margin: 7px 0 0; padding: 6px 7px; border-left: 2px solid #48a98d; border-radius: 0 4px 4px 0; background: #eef8f3; color: #43675d; font-size: 10px; line-height: 1.5; }
      .difference-note strong { color: #266e5d; }
      .action-flow { display: grid; grid-template-columns: minmax(0,1fr) 12px minmax(0,1fr) 12px minmax(0,1fr); align-items: stretch; gap: 3px; margin-bottom: 10px; }
      .flow-card { min-width: 0; padding: 6px; border: 1px solid #e2eae7; border-radius: 6px; background: #fff; opacity: .68; }
      .flow-card.current { border-color: #7fc9b0; background: #f1faf5; opacity: 1; box-shadow: 0 0 0 1px #d2eee1; }
      .flow-card small { display: block; margin-bottom: 4px; color: #398775; font: 700 8px "Segoe UI",Arial,sans-serif; letter-spacing: .35px; }
      .flow-card strong { display: block; color: #3c5b55; font-size: 9px; line-height: 1.35; overflow-wrap: anywhere; }
      .flow-card p { margin: 4px 0 0; color: #71817e; font-size: 9px; line-height: 1.4; overflow-wrap: anywhere; }
      .flow-arrow { align-self: center; color: #53a28a; font-size: 11px; text-align: center; }
      .fields { display: grid; gap: 8px; }
      label { display: grid; gap: 4px; color: #637673; font-size: 10px; font-weight: 600; }
      input { width: 100%; padding: 8px; border: 1px solid #dce7e4; border-radius: 5px; color: #425653; font: 11px "Segoe UI",Arial,sans-serif; background: #fbfdfc; }
      select { width: 100%; padding: 8px; border: 1px solid #dce7e4; border-radius: 5px; color: #425653; font: 11px "Segoe UI",Arial,sans-serif; background: #fbfdfc; }
      .choice-control { grid-template-columns: 14px minmax(0,1fr); align-items: center; gap: 7px; }
      .choice-control input { width: 14px; height: 14px; margin: 0; accent-color: #268c77; }
      input:focus,select:focus { outline: 2px solid #a5ddc6; outline-offset: 1px; }
      .choice-control { cursor: pointer; }
      .mouse-playground { display: grid; gap: 9px; }
      .mouse-instructions { margin: 0 !important; color: #627773 !important; }
      .mouse-source { justify-self: start; padding: 9px 12px; border: 1px solid #b9d8ce; border-radius: 6px; background: #f2faf6; color: #286e5c; font: 700 11px "Segoe UI",Arial,sans-serif; cursor: grab; }
      .mouse-source:active { cursor: grabbing; }
      .mouse-source.is-hovered { outline: 2px solid #8ccdb5; outline-offset: 2px; }
      .mouse-source.is-dragging { opacity: .55; }
      .mouse-drop-zone { display: grid; min-height: 58px; place-items: center; padding: 10px; border: 2px dashed #c7d8d3; border-radius: 7px; color: #6c827c; font-size: 11px; }
      .mouse-drop-zone.is-over,.mouse-drop-zone.has-item { border-color: #4ca889; background: #eef8f2; }
      .mouse-drop-zone .mouse-source { justify-self: center; }
      .mouse-hold { justify-self: start; padding: 8px 11px; border: 1px solid #e3e8e5; border-radius: 5px; background: #fff; color: #516a64; font: 600 11px "Segoe UI",Arial,sans-serif; touch-action: none; }
      .mouse-hold.is-holding { border-color: #318a79; background: #eaf7f0; box-shadow: 0 0 0 3px #318a7926; }
      .fact-list { display: grid; gap: 5px; }
      .fact-item { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 6px; padding: 6px 7px; border: 1px solid #e6eeeb; border-radius: 5px; background: #fbfdfc; color: #536966; font-size: 10px; line-height: 1.4; }
      .fact-item strong { color: #318a79; }
      .demo-action-button { margin-top: 10px; padding: 8px 11px; border: 0; border-radius: 5px; background: #268c77; color: white; font: 600 11px "Segoe UI",Arial,sans-serif; cursor: pointer; }
      .demo-action-button:hover { background: #187762; }
      .demo-action-button:focus-visible { outline: 2px solid #82cbb1; outline-offset: 2px; }
      .demo-action-button:disabled { cursor: default; opacity: .7; }
      .demo-outcome { margin: 8px 0 0; padding: 7px 8px; border-radius: 5px; background: #edf7f2; color: #286e5c; font-size: 10px; font-weight: 700; line-height: 1.5; overflow-wrap: anywhere; }
      .status { min-height: 14px; margin: 9px 0 0; color: #23866f; font-size: 11px; font-weight: 600; }
      .result-list { display: grid; gap: 6px; margin-top: 10px; }
      .result-list div { padding: 7px 8px; border: 1px solid #e8efed; border-radius: 5px; color: #536966; font-size: 11px; }
      .step-strip { display: flex; gap: 4px; margin-top: 14px; }
      .step-strip span { height: 4px; flex: 1; border-radius: 4px; background: #e4edeb; }
      .step-strip span.done { background: #41ae91; }
      .step-label { display: block; margin-top: 6px; color: #8b9996; font: 10px "Segoe UI",Arial,sans-serif; }
      @media (max-width: 430px) { body { padding: 10px; } main { margin-top: 13px; } h1 { font-size: 17px; } }
    </style>
  </head>
  <body>
    <header class="site-header">
      <span class="brand"><img class="brand-mark" src="../assets/brand-icon.svg" alt="" /> Demo learning app</span>
      <small>PLAYWRIGHT PRACTICE</small>
    </header>
    <main>
      <small class="eyebrow" id="demo-category">SAMPLE PAGE</small>
      <h1 id="demo-title">Interactive browser demo</h1>
      <p class="intro" id="demo-intro"></p>
      <section class="visual-guide" aria-label="Before and after browser comparison">
        <div class="guide-heading"><strong>PICTURE GUIDE · WHAT CHANGES?</strong><span id="compare-progress"></span></div>
        <div class="compare-panels">
          <article class="compare-panel">
            <small>BEFORE</small>
            <div id="before-picture"></div>
            <p id="before-copy"></p>
          </article>
          <span class="compare-arrow" aria-hidden="true">→</span>
          <article class="compare-panel after">
            <small>AFTER</small>
            <div id="after-picture"></div>
            <p id="after-copy"></p>
          </article>
        </div>
        <p class="difference-note"><strong>Key difference:</strong> <span id="difference-copy"></span></p>
      </section>
      <section class="action-flow" aria-label="How the Playwright action works">
        <article class="flow-card" id="flow-card-test"><small>1 · TEST CODE</small><strong id="flow-test-title"></strong><p id="flow-test-copy"></p></article>
        <span class="flow-arrow" aria-hidden="true">→</span>
        <article class="flow-card" id="flow-card-playwright"><small>2 · PLAYWRIGHT</small><strong id="flow-action-title"></strong><p id="flow-action-copy"></p></article>
        <span class="flow-arrow" aria-hidden="true">→</span>
        <article class="flow-card" id="flow-card-result"><small>3 · BROWSER RESULT</small><strong id="flow-result-title"></strong><p id="flow-result-copy"></p></article>
      </section>
      <section class="demo-card" aria-live="polite">
        <h2 id="card-title"></h2>
        <p id="card-description"></p>
        <div class="fields" id="demo-fields"></div>
        <button class="demo-action-button" id="demo-action" type="button"></button>
        <p class="demo-outcome" id="demo-outcome" hidden></p>
        <p class="status" id="demo-status"></p>
        <div class="result-list" id="demo-results"></div>
      </section>
      <div class="step-strip" id="step-strip" aria-hidden="true"></div>
      <small class="step-label" id="step-label"></small>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const lesson = params.get("lesson") || "Playwright demo";
      let step = Number(params.get("step") || 0);
      let stepTitle = params.get("stepTitle") || "";
      let stepDetail = params.get("stepDetail") || "";
      const steps = Math.max(1, Number(params.get("steps") || 4));
      const scenarios = {
        "Locators & auto-waiting": {

        },
        "Authentication & storage state": {

          action: "Confirm choices", result: "✓ Preferences saved"
        },
        "Pagination & paged results": {

        "Navigate backward & forward": {

        "Multiple tabs, windows & popups": {

          cardTitle: "Open browser pages", description: ["The context contains the original page.", "A click opens and captures the report popup.", "A second action creates a help page in the same context.", "The test selects the intended Page and brings it to the front."],
          fields: [["Page 1", "Home"], ["Page 2", "Report popup"], ["Page 3", "Help · active"]], action: "Switch to Page 3", result: "✓ Help page is active"
        },
        "Frames & nested iframes": {
          category: "NESTED FRAMES", pageTitle: "Embedded survey", intro: "Each frame boundary contains another document to locate through.",
          cardTitle: "Frame hierarchy", description: ["The top-level page contains the outer iframe.", "The outer document contains the middle iframe.", "The middle document contains a third nested iframe.", "The test locates Submit answer inside the deepest frame."],
          fields: [["Frame path", "Main → #outer → #middle → #inner"], ["Target", "Submit answer · frame 3"]], action: "Submit answer", result: "✓ Answer received"
        },
        "Shadow DOM components": {
          category: "WEB COMPONENT", pageTitle: "Preferences component", intro: "Supported Playwright locators can traverse open shadow roots.",
          cardTitle: "Settings panel", description: ["A custom element renders its controls inside an open shadow root.", "A role locator finds the visible Save settings button.", "The test activates the component's public control.", "The public page confirms the saved state; closed roots stay encapsulated."],
          fields: [["Component", "<settings-panel> · open shadow root"], ["Control", "button · Save settings"]], action: "Save settings", result: "✓ Settings saved"
        },
        "API requests & network handling": {
          category: "API + BROWSER NETWORK", pageTitle: "Catalog service", intro: "Compare direct API setup with browser response observation and route mocks.",
          cardTitle: "Items endpoint", description: ["APIRequestContext creates test data directly.", "The test listens for /api/items before clicking Load items.", "The browser request receives a status and JSON response.", "A route can fulfill a mocked response for a deterministic UI test."],
          fields: [["Endpoint", "POST /todos · GET /api/items"], ["Response", "HTTP 200 · JSON"]], action: "Load items", result: "✓ 3 items rendered", items: ["Notebook · $8", "Canvas bag · $24", "Desk lamp · $32"]
        },
        "Record & replay with codegen": {
          category: "RECORD & REPLAY", pageTitle: "Recorded journey", intro: "Codegen records a first draft; assertions make the replay meaningful.",
          cardTitle: "Course search", description: ["Start codegen and perform a user journey in the browser.", "Generated Python contains candidate locators and actions.", "Review selectors and add an assertion for the expected result.", "Replay the reviewed test with pytest or the standalone script."],
          fields: [["Recorder", "python -m playwright codegen"], ["Replay", "pytest -q tests/test_journey.py"]], action: "Replay journey", result: "✓ Test passed"
        },
        "Assertions & expect": {
          category: "MEMBER DASHBOARD", pageTitle: "Your dashboard", intro: "The test waits for this heading to become visible before passing.",
          cardTitle: "Welcome, Asha", description: ["The test locates the dashboard heading.", "The visibility assertion retries while the page updates.", "The expected heading is now visible.", "The Playwright assertion passes."],
          fields: [], action: "Dashboard ready", result: "✓ Assertion passed"
        }
      };
      const scenario = scenarios[lesson] || {
        category: "SAMPLE PAGE", pageTitle: lesson, intro: "A local demo page showing the browser state as the Playwright flow progresses.",
        cardTitle: "Demo interaction", description: ["The Python test starts this browser workflow.", "Playwright sends the selected step to the browser.", "The sample page processes the interaction.", "The test can inspect the visible result."],
        fields: [["Sample input", "Playwright learner"]], action: "Continue", result: "Step complete"
      };
      const textFormLessons = new Set([
        "Locators & auto-waiting",
        "Click, fill & keyboard actions",
        "Authentication & storage state"
      ]);
      const actionLabels = {
        "Locators & auto-waiting": "Save profile",
        "Click, fill & keyboard actions": "Send message",
        "Mouse actions: hover, hold & drag-and-drop": "Run mouse gesture",
        "Network requests & API testing": "Load items",
        "Authentication & storage state": "Sign in",
        "Role & text locators in practice": "Save profile",
        "Checkboxes, radio buttons & dropdowns": "Apply selected options",
        "Pagination & paged results": "Next page",
        "Navigate backward & forward": "Replay history navigation",
        "Multiple tabs, windows & popups": "Open Page 3",
        "Frames & nested iframes": "Submit answer in nested frame",
        "Shadow DOM components": "Save settings",
        "API requests & network handling": "Load items",
        "Record & replay with codegen": "Replay recorded test",
        "Assertions & expect": "Run assertion"
      };
      const editableValues = new Map();
      let actionComplete = false;
      let currentPageNumber = 1;
      let historyPosition = 1;
      let activeTab = 0;
      let networkLoaded = false;
      let mouseDropped = false;
      let mouseIsHolding = false;
      let mouseIsHovering = false;
      const lessonComparisons = {
        "What is Playwright?": ["A person repeats browser checks by hand.", "A Python test drives a browser and checks the result.", "Automation makes browser actions repeatable across supported engines."],
        "Install Playwright for Python": ["Python code has no installed browser engines to launch.", "The Python package and Chromium, Firefox, or WebKit are ready.", "Installing the package and installing browser binaries are separate setup steps."],
        "Launch, page & browser context": ["No isolated browser session or tab exists yet.", "A Browser contains an isolated Context, which contains a Page.", "Context isolates cookies and storage; Page represents a tab."],
        "Your first browser test": ["The page is unopened and the expected result is unchecked.", "The test navigates, performs an action, and asserts visible behavior.", "A test connects setup, user behavior, an assertion, and cleanup."],
        "Sync & async APIs": ["Browser calls block in a synchronous script.", "The async API awaits browser operations inside the event loop.", "Choose sync or async to match the surrounding Python runtime."],

        "CSS, text & test-id locators": ["The target has not been scoped to a stable selector.", "CSS, text, or an agreed test ID identifies the target.", "Use semantic locators first; CSS/XPath are fallback choices."],
        "Advanced browser interactions": ["The browser is in its initial state.", "A focused browser action changes the visible page state.", "Use the Playwright action that matches the actual user interaction."],

        "Pytest & pytest-playwright": ["A test has no managed browser page.", "Pytest injects a page fixture and cleans its resources.", "Fixtures manage browser lifecycle so tests can focus on behavior."],
        "Fixtures, hooks & test isolation": ["Tests risk sharing mutable cookies and browser state.", "Each test receives isolated state and fixture teardown runs afterward.", "Fresh per-test fixtures prevent state leakage and ordering dependencies."],
        "Navigation, waits & timeouts": ["The test continues before the required page state is ready.", "The test waits for a meaningful load or locator condition.", "Condition-based waits replace arbitrary sleeps and expose timeout failures."],
        "Forms, dialogs & file uploads": ["The form has not been submitted; dialogs and file data are unhandled.", "Controls are filled, the dialog handler is ready, and the upload is supplied.", "Register event handlers before triggering dialogs; use set_input_files for uploads."],

          stepTitle = typeof event.data.stepTitle === "string" ? event.data.stepTitle : "";
          stepDetail = typeof event.data.stepDetail === "string" ? event.data.stepDetail : "";
          renderDemo();
          return;
        }
        if (event.data?.type === "playwright-demo-execution-state") {
          if (!Array.isArray(event.data.lines)) return;
          resetCodeDemoState();
          event.data.lines.forEach((line, index) => {
            if (typeof line === "string") runCodeLine({
              line,
              triggerAction: index === event.data.actionIndex
            });
          });
          return;
        }
      });
    </script>
  </body>
</html>
